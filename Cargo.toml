[package]
name = "Alloy-Project"
version = "0.0.4"
edition = "2021"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
bevy = "0.14"

[features]
dev = ["bevy/dynamic_linking"]
